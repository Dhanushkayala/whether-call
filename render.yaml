services:
  - type: web
    name: whether-call-backend
    env: python
    buildCommand: pip install -r output/backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir output/backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: MAP_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: AVIATION_API_KEY
        sync: false
